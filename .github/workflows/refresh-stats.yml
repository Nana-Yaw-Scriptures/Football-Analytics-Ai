name: Refresh player stats

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install understatapi requests pandas

      - name: Scrape all leagues
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -c "from services.api_football_scraper import scrape_all_leagues; scrape_all_leagues()"

      - name: Rebuild merged player files
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -c "from services.merged_player_service import rebuild_all; rebuild_all()"

      - name: Show per-league counts
        run: python -c "import json,glob; [print(f.split('merged_')[1].replace('_2026.json',''), '->', len(json.load(open(f,encoding='utf-8'))), 'players') for f in glob.glob('cache/merged_*_2026.json')]"

      - name: Commit and push if changed
        run: |
          git config user.name  "scorina-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache/merged_*.json cache/players_*.json cache/standings_cache_*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh player stats ($(date -u +%Y-%m-%d))"
            git push
          fi